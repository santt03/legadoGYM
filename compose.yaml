services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: legadogym
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - legado_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legadogym"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  legado_pgdata:
