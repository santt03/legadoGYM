<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101416" />
    <title>Sin conexión · Legado Gym</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#25352a 0,#101416 45%,#070809 100%);color:#fff;font-family:system-ui,sans-serif}.card{max-width:360px;text-align:center}.card img{width:92px;border-radius:24px;box-shadow:0 18px 35px #0008}.eyebrow{margin:20px 0 8px;color:#c3f400;font-size:11px;font-weight:800;letter-spacing:.2em}.card h1{margin:0;font-size:30px}.card p{margin:14px 0 24px;line-height:1.6;color:#b7bec4}.card button{border:0;border-radius:12px;padding:13px 18px;background:#c3f400;color:#152000;font-weight:800;font-size:15px}.hint{display:block;margin-top:17px;color:#7f8a91;font-size:12px}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="Legado Gym" />
      <p class="eyebrow">MODO SIN CONEXIÓN</p>
      <h1>Tu espacio te espera.</h1>
      <p>Conectate a internet para actualizar tu rutina, dieta y datos del gimnasio.</p>
      <button type="button" onclick="location.reload()">Reintentar conexión</button>
      <small class="hint">Si ya habías abierto la app, tus últimos datos estarán disponibles al volver a conectarte.</small>
    </main>
  </body>
</html>
